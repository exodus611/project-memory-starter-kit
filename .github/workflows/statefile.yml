name: project memory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project memory
        uses: exodus611/statefile@8e9dc90f98ee181b885fec72ce7f771b66d60057
        with:
          state-file: NOTES.md
          max-age-days: '14'
          strict: 'true'
