name: release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the public package
        uses: exodus611/releasecheck@b565180b141658b5370225f10e3775b50c36059e
        with:
          folder: .
          manifest: releasecheck.json
